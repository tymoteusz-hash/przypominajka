# Buduje APK (release) na serwerach GitHuba – po każdym pushu albo ręcznie (Actions → Build APK → Run workflow).
# Gotowy plik: zakładka Actions → wybrany przebieg → sekcja Artifacts → "Przypominajka".
#
# Podpis: jeśli w Settings → Secrets and variables → Actions są sekrety
#   KEYSTORE_BASE64 (plik przypominajka.jks zakodowany base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
# APK jest podpisany kluczem przypominajka.jks i instaluje się jako aktualizacja. Bez nich – kluczem debug.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # W repozytorium nie ma gradlew – instalujemy tę samą wersję, co w gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Klucz podpisu z sekretów
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > przypominajka.jks
          cat > keystore.properties <<'EOF'
          storeFile=przypominajka.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Brak klucza – podpis debug
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::Brak sekretu KEYSTORE_BASE64 – APK podpisany kluczem debug, nie zainstaluje się na obecną wersję."

      - name: Build
        run: gradle :app:assembleRelease --no-daemon

      - name: Zmiana nazwy
        run: mv app/build/outputs/apk/release/app-release.apk Przypominajka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Przypominajka
          path: Przypominajka.apk
          retention-days: 14
